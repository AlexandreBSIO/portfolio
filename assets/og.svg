<!--
  og:image pour le partage social (1200x630).
  Ce fichier SVG fonctionne sur Twitter/X, Discord et la majorité des crawlers modernes.
  Pour LinkedIn : convertis ce fichier en PNG (ex. avec Inkscape, Figma ou squoosh.app)
  et remplace og.svg par og.png dans le <meta property="og:image"> de index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="av" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="#0e0b1a"/>

  <!-- Bande inférieure -->
  <rect x="0" y="528" width="1200" height="2" fill="rgba(124,58,237,0.35)"/>
  <rect x="0" y="530" width="1200" height="100" fill="#13101f"/>

  <!-- Barre d'accent gauche -->
  <rect x="0" y="0" width="4" height="528" fill="#7c3aed"/>

  <!-- Avatar -->
  <circle cx="148" cy="222" r="72" fill="url(#av)"/>
  <text x="148" y="238" text-anchor="middle"
        font-family="monospace,sans-serif"
        font-size="36" font-weight="700" fill="#ffffff">AB</text>

  <!-- Label formation -->
  <text x="268" y="172"
        font-family="monospace,sans-serif"
        font-size="17" font-weight="600" letter-spacing="3"
        fill="#7c3aed">BTS SIO - OPTION SISR</text>

  <!-- Nom -->
  <text x="268" y="244"
        font-family="sans-serif"
        font-size="62" font-weight="700"
        fill="#f5f3ff" letter-spacing="-1">Alexandre Boulou</text>

  <!-- Accent line -->
  <rect x="268" y="262" width="56" height="3" rx="2" fill="#7c3aed"/>

  <!-- Tagline -->
  <text x="268" y="312"
        font-family="sans-serif"
        font-size="23" fill="#a89fd8">Réseaux · Cybersécurité · Administration Système</text>

  <!-- Compétences clés -->
  <text x="268" y="378"
        font-family="monospace,sans-serif"
        font-size="15" fill="#9580cc">Active Directory · Kerberos · Proxmox · PingCastle · Python · Docker</text>

  <!-- URL dans la bande -->
  <text x="60" y="583"
        font-family="monospace,sans-serif"
        font-size="20" fill="#7c3aed">alexandre-boulou.vercel.app</text>
</svg>
